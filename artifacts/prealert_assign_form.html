<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-distributeOrTransferBills-add" autocomplete="off">
        <div class="form-group">
            <label class="col-sm-3 control-label" required="required">分配方式</label>
            <div class="col-sm-8">
                <label class="radio-box"> <input  type="radio"  name="distributionMode"  value="1" required/> <span>精准分配</span></label>
                <label class="radio-box"> <input  type="radio"  name="distributionMode"  value="2" required/> <span>顺序分配</span></label>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">预提醒组</label>
            <div class="col-sm-8">
<!--                <select name="deptIdList" id="deptIdList" class="form-control noselect2 selectpicker"-->
<!--                        th:with="deptIdList=${deptIdList}"-->
<!--                        data-actions-box="true" data-live-search="true"-->
<!--                        th:data-none-selected-text="#{common.choose}" multiple required>-->
<!--                    <option th:each="dept : ${deptIdList}" th:text="${dept.deptName}" th:value="${dept.deptId}"></option>-->
<!--                </select>-->
                <!-- 仍然保留原来的 name 和 id，使用 <input> 显示已选部门 -->
                <input type="text"
                       id="deptSelect"
                       name="deptSelect"
                       class="form-control noselect2"
                       placeholder="请选择部门"
                       onclick="selectMultiDeptTree()"
                       required>

                <!-- 隐藏的 <select> 用于传递数据 -->
                <select name="deptIdList" id="deptIdList" multiple required style="display: none;">
                    <!-- 选中的部门值将动态插入到这里 -->
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label"></label>
            <div class="col-sm-8">
                <input type="hidden" name="isFilter" value="">
                <label style="font-size: 15px">
                    <input id="isFilter" name="isFilter"  type="checkbox" value="1">过滤今日未打卡人员</input></label>
                <label style="font-size: 15px;margin-left: 10px">
                    <input id="isFilter2" name="isFilter"  type="checkbox" value="2">过滤今日不分单人员</input></label>
                <label style="font-size: 15px;margin-left: 20px">
                    <input id="isFilter3" name="isFilter"  type="checkbox" value="3">只分配能力最高档人员</input></label>
            </div>
        </div>
        <div class="form-group">
            <div class="select-selectpicker">
                <label class="col-sm-3 control-label">预提醒人员</label>
                <div class="col-sm-8">
                    <select name="ownerDictList" id="ownerDictList" class="form-control noselect2 selectpicker"
                            data-actions-box="true" data-live-search="true"
                            data-none-selected-text="请选择" multiple required>
                    </select>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label" required="required">是否协催调配</label>
            <div class="col-sm-8">
                <label class="radio-box"> <input  type="radio"  name="isAssistAllocation"  value="1" checked required/> <span>否</span></label>
                <label class="radio-box"> <input  type="radio"  name="isAssistAllocation"  value="2" required/> <span>是</span></label>
                <label>(注意：选择&quot;是&quot;,未催回案件会在晚上归还给原催收员)</label>
            </div>
        </div>
        <div id="hiddenText">
            <input type="hidden" id="userName" name="userName" value=""/>
            <input type="hidden" id ="opType" name="opType" value="2"/>
            <input type="hidden" id ="id" name="ids" value=""/>
        </div>

          </div>-->
    </form>
</div>

    }


    function submitHandler() {
        if ($.validate.form()) {
            var userNameStr = '';
            var chooseOwnerList = $("#ownerDictList option:selected").text().split(",");
            $("#ownerDictList option:selected").each(function () {
                userNameStr += $(this).val() + "-" + $(this).text() + ",";
            });
            userNameStr = userNameStr.substring(0,userNameStr.lastIndexOf(","));
            $("#userName").val(userNameStr);
            var distributionMode = $("input[name='distributionMode']:checked").val();
            var ids = "";
            if(distributionMode == 1){
                if ($.common.isEmpty(records)) {
                    $.modal.alertWarning(i18n("common.selectedOne"));
                    return;
                }
                if(!records){
                    $.modal.alertWarning(i18n("loan.collectionList.Please.select.the.order.first"));
                    return;
                }
                for (var i = 0; i < records.length; i++) {
                    var record = records[i];
                    var repayStatus = record.repaymentStatus;
                    if(repayStatus == 2){
                        $.modal.alertWarning(i18n("loan.preReminderList.tips"));
                        return;
                    }
                    ids += record.id;
                    if (i != records.length - 1) ids += ',';
                }
                if(userNameStr.split(',').length>1){
                    $.modal.alertWarning(i18n("loan.collectionList.descriptionTwo"));
                    return;
                }
            }else{
                // var records = $("#" + table.options.id).bootstrapTreeTable('getSelections')[0];
                if(records){
                    for (var i = 0; i < records.length; i++) {
                        var record = records[i];
                        var repayStatus = record.repaymentStatus;
                        if(repayStatus == 2 ){
                            $.modal.alertWarning(i18n("loan.preReminderList.tips"));
                            return;
                        }
                        ids += record.id;
                        if (i != records.length - 1) ids += ',';
                    }
                }
            }
            $("#id").val(ids);
            // $.operate.saveModal(prefix + "/updateDistributeOrTransferBills", $("#form-distributeOrTransferBills-add").serialize() + "&" + paramsData);
            $.ajax({
                url: prefix + "/updateDistributeOrTransferBills",
                type: "post",
                dataType: "json",
                data: $("#form-distributeOrTransferBills-add").serialize() + "&" + paramsData,
                beforeSend: function () {
                    $.modal.loading(i18n("common.progressData"));
                },
                success: function(result) {
                    if (result.code == web_status.SUCCESS) {
                        parent.layer.open({
                            type: 1,
                            title: '',
                            area: ['400px', '300px'],
                            btn: [i18n("loan.common.copy"), i18n("loan.common.close")],
                            closeBtn: 0,
                            content: `
                                <div style="
                                    max-height:260px;
                                    overflow-y:auto;
                                    padding:15px;
                                    word-break:break-all;
                                    line-height:1.8;
                                ">
                                    ${result.msg}
                                </div>
                            `,
                            yes: function(index){
                                copyText(result.msg);
                            },
                            btn2: function(index){
                                parent.layer.closeAll();
                            }
                        });

                    } else if (result.code == web_status.WARNING) {
                        $.modal.alertWarning(result.msg)
                        $.modal.closeLoading();
                    } else {
                        $.modal.alertError(result.msg);
                        $.modal.closeLoading();
                    }
                }
            })
        }
    }

    function copyText(text) {
        text = text.lastIndexOf('：') !== -1 ? text.slice(text.lastIndexOf('：') + 1) : text;
        if(!text){
            return;
        }
        const tempTextarea = document.createElement('textarea');
        tempTextarea.value = text;
        tempTextarea.style.position = 'fixed';
        document.body.appendChild(tempTextarea);
        tempTextarea.focus();
        tempTextarea.select();
        try {
            const successful = document.execCommand('copy');
            const msg = 'OK！';
            layer.msg(msg, {
                icon: successful ? 1 : 2
            });
        } catch (err) {
            console.error('Fallback: Oops, unable to copy', err);
            $.modal.msgError('copy failed');
        }
        document.body.removeChild(tempTextarea);
    }

    // 弹出树形菜单的结构
    function selectMultiDeptTree() {
        var url = ctx + "system/dept/selectMultiDeptTree?deptId=" + regionalDivisionId;
        var checkIds = $("#deptIdList").val();
        if (checkIds) {
            url = url + "&checkDeptIds=" + checkIds;
        }
        var options = {
            title: i18n('common.selectDept'),
            width: "380",
            url: url,
            callBack: function (index, layero) {
                var tree = layero.find("iframe")[0].contentWindow.$._tree;
                // 设置回调函数逻辑
                var selectedNodes = tree.getCheckedNodes(true);
                var selectedIds = [];
                var selectedNames = [];

                // 遍历所有选中的节点，筛选出子节点
                for (var i = 0; i < selectedNodes.length; i++) {
                    if (!selectedNodes[i].isParent) { // 只处理子节点
                        selectedIds.push(selectedNodes[i].id);
                        selectedNames.push(selectedNodes[i].name);
                    }
                }

                // 动态插入 <option> 元素（如果没有插入）
                selectedIds.forEach(function(id) {
                    // 如果选项不存在，插入新的选项
                    if ($("#deptIdList option[value='" + id + "']").length === 0) {
            $("#deptIdList").append('<option value="' + id + '" selected>'
                + i18n("ui.departmentWithId").replace("{0}", id) + '</option>');
                    }
                });
                // 设置选中的值，并刷新 selectpicker
                $("#deptIdList").val(selectedIds).trigger("change").selectpicker('refresh');
                // 隐藏按钮
                $("#deptIdList").next(".dropdown-toggle").hide();
                $("#deptSelect").val(selectedNames.join(","));

                // 关闭当前弹出层
                layer.close(index);
            }
        };

        $.modal.openOptions(options);
    }
