                    field: 'channelName',
                    title: i18n('user.refuse.channel'),
                    width: 80,
                    formatter: function(value) {
                        if ($.common.isEmpty(value)) {
                            return '-';
                        }
                        return '<div style="min-width: 80px;">' + $.table.tooltip(value, 10, 'open') + '</div>';
                    }
                },
                {
                    field: 'appOwnership',
                    title: i18n('common.appOwnership'),
                    width: 80,
                    formatter: function(value) {
                        if ($.common.isEmpty(value)) {
                            return '-';
                        }
                        return '<div style="min-width: 80px;">' + $.table.tooltip(value, 10, 'open') + '</div>';
                    }
                },
                {
                    field: 'appName',
                    title: i18n('common.appName'),
                    width: 100,
                    formatter: function(value) {
                        if ($.common.isEmpty(value)) {
                            return '-';
                        }
                        return '<div style="min-width: 100px;">' + $.table.tooltip(value, 15, 'open') + '</div>';
                    }
                },
                {
                    field: 'appH5Url',
                    title: i18n('offadmin.user.appAddress'),
                    formatter: function(value) {
                        if ($.common.isEmpty(value)) {
                            return '-';
                        }
                        var encodedValue = encodeURIComponent(value);
                        return '<span>' + $.table.tooltip(value, 24, 'open') + '</span>' +
                            '<a class="btn btn-info btn-xs" style="margin-left:5px;" href="javascript:void(0)" onclick="copyAppAddress(decodeURIComponent(\'' + encodedValue + '\'))">' +
                            '<i class="fa fa-copy"></i> ' + i18n('common.copy') + '</a>';
                    }
                },
                {
                    field: 'employeeLine',
                    title: i18n('offadmin.profile.lineAccount'),
                    formatter: function(value) {
                        return $.common.isEmpty(value) ? '-' : $.table.tooltip(value, 20, 'open');
                    }
                },
                {
                    field: 'lockStatus',
                    title: i18n('user.user.accountStatus'),
                    formatter: function(value, row) {
                        return statusTools(row);
                    }
                },
                {
                    field: 'createTime',
                    title: i18n('user.user.createTime'),
                    width: 100,
                    formatter: function(value) {
                        if ($.common.isEmpty(value)) {
                            return '-';
                        }
                        return '<div style="min-width: 100px;">' + value + '</div>';
                    }
                },
                {
                    field: 'employeeName',
                    title: i18n('loan.pre.Staff'),
                    width: 100,
                    formatter: function(value) {
                        if ($.common.isEmpty(value)) {
                            return '-';
                        }
                        return '<div style="min-width: 100px;">' + $.table.tooltip(value, 20, 'open') + '</div>';
                    }
                }
            ]
        };
        $.table.init(options);
    });

    /** 当前页选中客户按表格展示顺序返回；翻页和重新加载不保留选择。 */
    function getSelectedTransferUuids() {
        var rows = $('#bootstrap-table').bootstrapTable('getSelections') || [];
        return rows.map(function(row) {
            return row.uuid;
        }).filter(function(uuid) {
            return !$.common.isEmpty(uuid);
        });
    }

    function updateUserTransferButton() {
        var count = getSelectedTransferUuids().length;
        var $button = $('#userTransferButton');
        $('#userTransferButtonText').text(
            i18n('offadmin.user.transfer.button').replace('{0}', count));
        $button.toggleClass('disabled', count === 0)
            .attr('aria-disabled', count === 0 ? 'true' : 'false');
    }

    function openUserTransfer() {
        var customerUuids = getSelectedTransferUuids();
        if (customerUuids.length === 0) {
            return;
        }
        $.modal.openOptions({
            title: i18n('offadmin.user.transfer.title'),
            width: 720,
            height: Math.min(560, Math.max(420, $(window).height() - 80)),
            url: prefix + '/transfer',
            shadeClose: false,
            yes: function(index, layero) {
                var iframe = layero.find('iframe')[0];
                iframe.contentWindow.submitHandler(index, layero);
            }
        });
    }

    /** 转交弹窗从父页面读取当前页选择，避免把批量 UUID 暴露在 URL 中。 */
    function readUserTransferSelection() {
        return getSelectedTransferUuids();
    }

    /** 转交成功后刷新列表并清空当前页选择。 */
    function handleUserTransferSuccess(layerIndex, message) {
        $('#bootstrap-table').bootstrapTable('uncheckAll');
        updateUserTransferButton();
        $.table.refresh();
        layer.close(layerIndex);
        $.modal.msgSuccess(message);
    }

    function selectCreatorDeptTree() {
        var url = ctx + "system/dept/selectMultiDeptTree?deptId=&checkLinkMode=parentChild";
        var checkIds = $("#creatorDeptIdList").val();
        var selectedUserIds = $("#creatorUserIdList").val() || [];
        if (checkIds) {
            url = url + "&checkDeptIds=" + checkIds;
        }
        var options = {
            title: i18n('common.selectDept'),
            width: '380',
            url: url,
            callBack: function(index, layero) {
                var tree = layero.find("iframe")[0].contentWindow.$._tree;
                var selectedNodes = tree.getCheckedNodes(true);
                var selectedIds = [];
                var selectedNames = [];
                var selectedMap = {};
                for (var i = 0; i < selectedNodes.length; i++) {
                    var node = selectedNodes[i];
                    if (!node || $.common.isEmpty(node.id) || selectedMap[node.id]) {
                        continue;
                    }
                    selectedMap[node.id] = true;
                    selectedIds.push(node.id);
                    selectedNames.push(node.name);
                }
                setCreatorDeptSelection(selectedIds, selectedNames);
                layer.close(index);
                loadCreatorUserOptions(selectedUserIds);
            }
        };
        $.modal.openOptions(options);
    }

    function setCreatorDeptSelection(selectedIds, selectedNames) {
        $("#creatorDeptIdList").val((selectedIds || []).join(','));
        $("#creatorDeptNames").val((selectedNames || []).join(','));
    }

    function loadCreatorUserOptions(selectedUserIds) {
        var creatorDeptIds = $("#creatorDeptIdList").val();
        if ($.common.isEmpty(creatorDeptIds)) {
            clearCreatorUserOptions();
            return;
        }
        $.ajax({
            type: 'post',
            url: prefix + '/employeeOptions',
            data: {
                creatorDeptIds: creatorDeptIds
            },
            success: function(result) {
                if (result.code === web_status.SUCCESS) {
                    renderCreatorUserOptions(result.data || [], selectedUserIds || []);
                    return;
                }
                $.modal.msgError(result.msg || i18n("offadmin.user.employeeOptionsLoadFailed"));
                clearCreatorUserOptions();
            },
            error: function() {
                $.modal.msgError(i18n("offadmin.user.employeeOptionsLoadFailed"));
                clearCreatorUserOptions();
            }
        });
    }

    function renderCreatorUserOptions(options, selectedUserIds) {
        var $select = $("#creatorUserIdList");
        $select.empty();
        for (var i = 0; i < options.length; i++) {
            var option = options[i];
            $select.append(new Option(option.label, option.value));
        }
        $select.selectpicker('refresh');
        $select.selectpicker('val', selectedUserIds || []);
        $select.selectpicker('refresh');
    }

    function clearCreatorUserOptions() {
        var $select = $("#creatorUserIdList");
        $select.empty();
        $select.selectpicker('refresh');
        $select.selectpicker('val', []);
        $select.selectpicker('refresh');
    }

    function resetSearchForm() {
        $.form.reset();
        setCreatorDeptSelection([], []);
        clearCreatorUserOptions();
        $('.selectpicker').selectpicker('refresh');
    }

    function copyAppAddress(value) {
        if ($.common.isEmpty(value)) {
            return;
        }
        if (navigator.clipboard) {
            navigator.clipboard.writeText(value).then(function() {
                $.modal.msgSuccess(i18n('common.copySuccess'));
            }, function() {
                copyTextToClipboard(value);
            });
            return;
        }
        copyTextToClipboard(value);
    }

    function copyTextToClipboard(text) {
        var input = document.createElement('textarea');
        input.value = text;
        input.style.position = 'fixed';
        input.style.opacity = '0';
        document.body.appendChild(input);
        input.select();
        var successful = document.execCommand('copy');
        document.body.removeChild(input);
        if (successful) {
            $.modal.msgSuccess(i18n('common.copySuccess'));
        } else {
            $.modal.msgError(i18n('offadmin.msg.copyFailed'));
        }
    }

    function statusTools(row) {
        if (row.lockStatus == 1) {
            return "<i class='fa fa-toggle-off text-info fa-2x' onclick='enable(\"" + row.uuid + "\",\"" + row.appOwnership + "\")'></i>";
        }
        return "<i class='fa fa-toggle-on text-info fa-2x' onclick='disable(\"" + row.uuid + "\",\"" + row.appOwnership + "\")'></i>";
    }

    function disable(uuid, appOwnership) {
        $.modal.confirm(i18n("offadmin.user.disableConfirm"), function() {
            $.operate.post(prefix + "/changeLockStatus", { "uuid": uuid, "appOwnership": appOwnership, "lockStatus": 1 });
        });
    }

    function enable(uuid, appOwnership) {
        $.modal.confirm(i18n("offadmin.user.enableConfirm"), function() {
            $.operate.post(prefix + "/changeLockStatus", { "uuid": uuid, "appOwnership": appOwnership, "lockStatus": 0 });
        });
    }

    function openOfflineAdd() {
        $.modal.open(i18n("offadmin.user.add.title"), prefix + "/offline/add", 900, offlineDialogHeight());
    }

    function offlineDialogHeight() {
        return Math.min(680, Math.max(420, $(window).height() - 50));
    }

    function viewDetail(id, appOwnership) {
        var url = prefix + '/detail/' + id;
        if (appOwnership) {
            url += '?appOwnership=' + encodeURIComponent(appOwnership);
        }
        $.modal.openOptions({
            title: i18n("offadmin.user.mine") + " " + i18n("loan.common.detailed"),
            width: 800,
            height: $(window).height() - 50,
            url: url,
            skin: 'layui-layer-gray',
            btn: [i18n("loan.common.close")],
            yes: function (index) {
                layer.close(index);
            }
        });
    }

    var startLoanOpening = false;

    function openStartLoan(trigger, id, appOwnership) {
        if (startLoanOpening) {
            return;
        }
        startLoanOpening = true;
        var $trigger = $(trigger);
        $trigger.addClass('disabled').attr('aria-disabled', 'true');
        $.modal.loading(i18n("common.progressData"));
        $.get(prefix + "/offline/startLoan/precheck", { id: id, appOwnership: appOwnership }, function(result) {
            $.modal.closeLoading();
            if (result.code === 0) {
                $.modal.open(i18n("offadmin.user.startLoan.title"), prefix + "/offline/startLoan/" + id + "?appOwnership=" + encodeURIComponent(appOwnership), 960, 720);
            } else {
                $.modal.alertWarning(result.msg);
            }
        }).fail(function() {
            $.modal.closeLoading();
            $.modal.alertError(i18n("offadmin.msg.requestFailed"));
        }).always(function() {
            startLoanOpening = false;
            $trigger.removeClass('disabled').removeAttr('aria-disabled');
        });
    }

    function openProfileDebt(id, appOwnership) {
        if ($.common.isEmpty(id) || $.common.isEmpty(appOwnership)) {
            $.modal.alertWarning(profileDebtIncompleteMessage);
            return;
        }
        if (window.SaasCustomerProfile) {
            SaasCustomerProfile.openUserProfile(id, appOwnership, profileDebtTitle);
            return;
        }
        openProfileDebtOld(id, appOwnership);
    }

    /** 旧版 SAAS 客户资料（Thymeleaf profileDebt），不走 Vue 复用页 */
    function openProfileDebtOld(id, appOwnership) {
        if ($.common.isEmpty(id) || $.common.isEmpty(appOwnership)) {
            $.modal.alertWarning(profileDebtIncompleteMessage);
            return;
        }
        $.modal.openTab(profileDebtTitle, prefix + "/profileDebt/" + id + "?appOwnership=" + encodeURIComponent(appOwnership));
    }

    function selectCode() {
        $.modal.openOptions({
            title: i18n("common.query_check_code"),
            url: prefix + "/selectCode",
            btn: [i18n("loan.common.close")],
            yes: function (index) {
                layer.close(index);
            }
        });
    }

    function giveBlock(uuid, appOwnership) {
        $.modal.open(i18n("offadmin.user.blockReason"), prefix + "/giveBlock?uuid=" + uuid + "&appOwnership=" + appOwnership);
    }

    function deleteUser(uuid, ownerShip) {
        $.modal.open(i18n("offadmin.user.deleteTitle"), prefix + "/deleteUser?uuid=" + uuid + "&ownerShip=" + ownerShip);
    }
</script>
