							|| msgKey.indexOf('offadmin.msg.offlineAddEmployeeLine') === 0)) {

<script type="text/javascript">
    var prefix = ctx + "user/user";

    $(function() {
        $("#employeeLineConfigId").select2({
            theme: "bootstrap",
            placeholder: i18n("common.choose"),
            allowClear: true,
            minimumInputLength: 0,
            ajax: {
                url: prefix + "/offline/employeeLineOptions",
                dataType: "json",
                delay: 250,
                data: function(params) {
                    return {
                        keyword: params.term || "",
                        pageNum: params.page || 1,
                        pageSize: 20
                    };
                },
                processResults: function(response) {
                    var data = response && response.data ? response.data : {};
                    return {
                        results: data.results || [],
                        pagination: data.pagination || { more: false }
                    };
                },
                cache: true
            }
        }).on("change", function() {
            var selectedData = $(this).select2("data");
            var lineAccount = selectedData && selectedData.length > 0 ? selectedData[0].lineAccount : "";
            $("#employeeLine").val(lineAccount || "");
            $(this).valid();
        });
    });

    function showError(msg) {
        $("#error-text").text(msg);
        $("#error-msg").show();
    }

    function hideError() {
        $("#error-msg").hide();
        $("#error-text").text("");
    }
    function refreshParentUserList() {
        // 新增成功后刷新父页面列表，父页面 queryParams 会读取当前查询表单条件。
        if (window.parent && window.parent.$ && window.parent.$.table) {
            window.parent.$.table.refresh();
        }
    }
    function submitHandler(indexOrOptions, layero, forceEmployeeLinePhoneDuplicate) {
        return new Promise((resolve, reject) => {
            var embed = indexOrOptions && typeof indexOrOptions === 'object' && indexOrOptions.embed === true;
            if (!$.validate.form()) {
                reject({ code: 500, msg: 'validate failed' });
                return;
            }
            hideError();
            var data = $('#form-offline-add').serialize();
            if (forceEmployeeLinePhoneDuplicate === true) {
                data += (data ? '&' : '') + 'forceEmployeeLinePhoneDuplicate=true';
            }
            $.ajax({
                url: prefix + "/offline/addUser",
                type: "POST",
                data: data,
                beforeSend: function() {
                    $.modal.loading(i18n("tb.2fb90b0535"));
                },
                success: function(result) {
                    $.modal.closeLoading();
                    if (result.confirmEmployeeLinePhoneDuplicate === true) {
                        layer.confirm(result.msg, {
                            icon: 0,
                            title: i18n('offadmin.msg.offlineAddEmployeeLinePhoneExistsTitle'),
                            btn: [i18n('offadmin.msg.offlineAddEmployeeLinePhoneChooseOther'),
                                i18n('offadmin.msg.offlineAddEmployeeLinePhoneForceContinue')]
                        }, function(confirmIndex) {
                            layer.close(confirmIndex);
                            showError(result.msg);
                            resolve(result);
                        }, function(confirmIndex) {
                            layer.close(confirmIndex);
                            submitHandler(indexOrOptions, layero, true).then(resolve).catch(reject);
                        });
                        return;
                    }

                    resolve(result);
                    if (result.code === web_status.SUCCESS) {
                        if (embed) {
                            return;
                        }
                        // 关闭当前弹窗，刷新父表格
                        $.modal.close();
                        refreshParentUserList();
                        if (parent && parent.$) {
                            parent.$.modal.msgSuccess(result.msg);
                            parent.$.table.refresh();
                            /*
                            // 新增成功后暂不自动打开编辑用户详情弹窗，避免详情页确认按钮触发 submitHandler 报错。
                            var data = result.data;
                            if (data && data.id) {
                                var detailUrl = prefix + "/detail/" + data.id;
                                if (data.appOwnership) {
                                    detailUrl += "?appOwnership=" + encodeURIComponent(data.appOwnership);
                                }
                                parent.$.modal.open(i18n("tb.b4f21eca11"), detailUrl, 900, offlineDialogHeight());
                            }
                            */
                        }
                    } else {
                        showError(result.msg);
                    }
                },
                error: function() {
                    $.modal.closeLoading();
                    showError(i18n('ui.requestFailedRetry'));
                    reject({ code: 500, msg: 'request failed' });
                }
            });
        });
    }
    function offlineDialogHeight() {
        return Math.min(680, Math.max(420, $(window).height() - 50));
    }
</script>
